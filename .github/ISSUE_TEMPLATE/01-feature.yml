name: Feature
description: Propose a new feature for WebSpace.
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should the feature do, and for which role (Student, Tutor, Administrator)?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Conditions that must be true for this feature to be accepted.
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Responsible Member
      description: GitHub username of the team member responsible (e.g. @username). Leave as TBD if not yet decided.
      placeholder: "@username or TBD"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Related Module
      options:
        - Authentication & Profile
        - Student Learning
        - Quiz & Assessment
        - Tutor & Submission/Feedback
        - Admin & Content Management
        - Database
        - UI/UX
        - Testing
        - Documentation
        - Integration / Cross-cutting
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing Requirements
      description: Unit, integration and manual tests needed to verify the feature, including validation and authorization cases.
    validations:
      required: true
