name: Enhancement
description: Improve an existing feature.
title: "enhancement: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Which existing behaviour should change, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Conditions that must be true for the enhancement to be accepted.
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Responsible Member
      description: GitHub username of the team member responsible (e.g. @username). Leave as TBD if not yet decided.
      placeholder: "@username or TBD"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Related Module
      options:
        - Authentication & Profile
        - Student Learning
        - Quiz & Assessment
        - Tutor & Submission/Feedback
        - Admin & Content Management
        - Database
        - UI/UX
        - Testing
        - Documentation
        - Integration / Cross-cutting
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing Requirements
      description: Tests to add or update, and regression checks for existing behaviour.
    validations:
      required: true
